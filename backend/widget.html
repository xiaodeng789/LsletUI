<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LsletUI 胶囊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: transparent;
        }
        
        .capsule-container {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #4a90e2 0%, #357abd 100%);
            border-radius: 999px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            opacity: 1;
            transition: opacity 0.6s ease-in-out;
        }

        /* 空闲减淡状态：降低不透明度 */
        .capsule-container.dim {
            opacity: 0.6;
        }

        .capsule-content {
            text-align: center;
            padding: 10px;
        }

        .capsule-title {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .capsule-subtitle {
            font-size: 10px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="capsule-container" id="capsule">
        <div class="capsule-content">
            <div class="capsule-title">LsletUI</div>
            <div class="capsule-subtitle">Lite</div>
        </div>
    </div>

    <script>
        // 设置胶囊减淡状态
        function setCapsuleDim(dimmed) {
            const capsule = document.getElementById('capsule');
            if (capsule) {
                if (dimmed) {
                    capsule.classList.add('dim');
                } else {
                    capsule.classList.remove('dim');
                }
            }
        }
        
        // 暴露给Python后端调用
        window.setCapsuleDim = setCapsuleDim;
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('LsletUI 胶囊已加载');
        });
    </script>
</body>
</html>
