<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 背景圆形 -->
  <circle cx="50" cy="50" r="45" fill="#4a90e2" opacity="0.9"/>
  
  <!-- 内部圆形 -->
  <circle cx="50" cy="50" r="35" fill="#357abd" opacity="0.8"/>
  
  <!-- 中心点 -->
  <circle cx="50" cy="50" r="15" fill="white" opacity="0.9"/>
  
  <!-- 装饰线条 -->
  <line x1="50" y1="20" x2="50" y2="80" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="20" y1="50" x2="80" y2="50" stroke="white" stroke-width="2" opacity="0.6"/>
</svg>